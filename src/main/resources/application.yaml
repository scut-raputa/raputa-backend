server:
  port: 8080

spring:
  application:
    name: raputa

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/raputa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

security:
  jwt:
    secret: "change-me-please-THIS-IS-A-SECRET-KEY-AT-LEAST-32-CHARS"
    exp-minutes: 720

raputa:
  storage:
    root: ${RAPUTA_STORAGE_ROOT:/tmp/raputa/storage}
    tmp-dir: ${RAPUTA_TMP_DIR:/tmp/raputa/tmp}
  inference:
    base-url: ${RAPUTA_INFERENCE_BASE_URL:http://127.0.0.1:8000}
    dysphagia-base-url: ${RAPUTA_DYS_INFERENCE_BASE_URL:http://127.0.0.1:8001}
    aspiration-base-url: ${RAPUTA_ASP_INFERENCE_BASE_URL:http://127.0.0.1:8002}
    connect-timeout-ms: 3000
    read-timeout-ms: 15000
    health-path: /health
    live-path: /health/live
    ready-path: /health/ready
    models-path: /models
    upload-predict-path: /upload_predict/
    dysphagia-auto-predict-path: /upload_predict/dys/
    dysphagia-direct-predict-path: /upload_predict/dys_direct/
    aspiration-auto-predict-path: /upload_predict/
    aspiration-direct-predict-path: /upload_predict/asp_direct/
    health-check-interval-seconds: 10
  model:
    runtime-cache-ttl-seconds: 10
  device-lock:
    ttl-seconds: 45
    heartbeat-interval-seconds: 15
    cleaner-interval-seconds: 30

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    displayRequestDuration: true
    showExtensions: true
    showCommonExtensions: true
  show-actuator: false

logging:
  level:
    org.hibernate.orm.connections.pooling: warn
